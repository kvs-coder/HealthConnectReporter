name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-guard:
    name: Version / Changelog
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Top CHANGELOG.md entry matches the release manifest
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          header=$(grep -m1 '^## ' CHANGELOG.md || true)
          echo "manifest: $version, changelog: $header"
          if [ "$version" = "0.0.0" ] && [ -z "$header" ]; then
            echo "Nothing released yet"
            exit 0
          fi
          [[ "$header" =~ ^"## [$version] - "[0-9]{2}\.[0-9]{2}\.[0-9]{4}\.$ ]] || {
            echo "::error file=CHANGELOG.md,line=1::Expected '## [$version] - dd.MM.yyyy.', got '$header'"
            exit 1
          }

  build:
    name: Lint, test, API check, build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint
        run: ./gradlew ktlintCheck detekt :library:lintDebug
      - name: Test with coverage gate
        run: ./gradlew :library:testDebugUnitTest :library:koverXmlReport :library:koverVerify
      - name: Public API check
        run: ./gradlew :library:apiCheck
      - name: Build library and example app
        run: ./gradlew :library:assembleRelease :app:assembleDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            library/build/reports
            library/build/test-results
          if-no-files-found: ignore
